name: flavorag-observability

# Prometheus + Grafana + Jaeger for the flavorag-server on the host machine.
# The app listens on host port 9090 (settings.server_port), so Prometheus is
# published on 9091 to avoid the clash.
#
#   docker compose -f observability-stack.compose.yaml up -d
#
#   Prometheus UI : http://localhost:9091
#   Grafana       : http://localhost:3000  (admin / admin)
#   Jaeger UI     : http://localhost:16686 (traces; set OTEL_ENABLED=true)

services:
  prometheus:
    container_name: flavorag-prometheus
    image: prom/prometheus:v2.53.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "9091:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    container_name: flavorag-grafana
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  jaeger:
    container_name: flavorag-jaeger
    image: jaegertracing/all-in-one:1.58
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI
      - "4318:4318"     # OTLP HTTP (matches otel_exporter_otlp_endpoint)
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
