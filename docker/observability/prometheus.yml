global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # flavorag-server running on the host (settings.server_port = 9090)
  - job_name: flavorag-server
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9090"]
        labels:
          service: flavorag-server

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
