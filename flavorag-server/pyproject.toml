[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]

[project]
name = "flavorag-server"
version = "0.0.6"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29",
    "alembic>=1.13,<2",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "redis[hiredis]>=5.0,<9",
    "pymilvus>=2.4,<3",
    "elasticsearch[async]>=8.0,<9",
    "boto3>=1.34,<2",
    "httpx>=0.27,<1",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "apscheduler>=3.10",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0",
    "neo4j>=5.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "beautifulsoup4>=4.12",
    "PyPDF2>=3.0",
    "pypdf>=6.0",
    "pdfplumber>=0.11",
    "Pillow>=11.0",
    "pypdfium2>=4.30",
    "aiosqlite>=0.20",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "reportlab>=4.0",
    "ruff>=0.12",
]
