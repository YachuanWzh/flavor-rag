[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]

[project]
name = "flavorag-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "redis[hiredis]>=5.0",
    "pymilvus>=2.4",
    "elasticsearch[async]>=8.0",
    "boto3>=1.34",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "apscheduler>=3.10",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0",
    "neo4j>=5.0",
    "python-docx>=1.1",
    "PyPDF2>=3.0",
    "pypdf>=6.0",
    "pdfplumber>=0.11",
    "Pillow>=11.0",
    "pypdfium2>=4.30",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "reportlab>=4.0",
]
